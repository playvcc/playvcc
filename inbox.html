<!DOCTYPE html><html><head><meta charset="UTF-8"><title>VCC Inbox</title><link rel="stylesheet" href="styles.css">
<style>
body{background:#080808;color:#fff;font-family:Arial;margin:0}
nav{padding:18px;background:#111}
nav a{color:#fff;margin-right:14px;text-decoration:none}
.wrap{max-width:1100px;margin:35px auto;padding:20px}
.card{background:#111;border:1px solid #2d2d2d;border-radius:16px;padding:20px;margin-bottom:18px}
input,select,textarea{width:100%;box-sizing:border-box;padding:12px;background:#070707;color:#fff;border:1px solid #333;border-radius:10px;margin:7px 0}
button,.btn{background:#f5c542;color:#000;border:0;border-radius:10px;padding:12px 16px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block;margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.log{background:#070707;border-radius:12px;padding:12px;min-height:110px;white-space:pre-wrap}
.meta{color:#aaa;font-size:13px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><nav><a href="index.html">Home</a><a href="manage-team.html">Manage Team</a><a href="inbox.html">Inbox</a></nav>
<main class="wrap"><h1>VCC Inbox</h1><section id="messages">Loading...</section></main>
<script src="supabase-config.js"></script><script src="vcc-live.js"></script>
<script>
async function loadMessages(){
  const box=document.getElementById("messages");
  try{
    const messages=await VCCLive.loadInbox();
    if(!messages.length){ box.innerHTML="<div class='card'>No messages yet.</div>"; return; }
    box.innerHTML=messages.map(function(m){
      return "<div class='card'><h2>"+m.title+"</h2><p>"+(m.body||"")+"</p><p class='meta'>"+m.message_type+" · "+m.status+" · "+new Date(m.created_at).toLocaleString()+"</p>"+(m.action_url ? "<a class='btn' href='"+m.action_url+"'>Open</a> " : "")+"<button onclick=\"markRead('"+m.id+"')\">Mark Read</button></div>";
    }).join("");
  }catch(err){ box.innerHTML="<div class='card'>Error: "+err.message+"</div>"; }
}
async function markRead(id){ await VCCLive.markMessageRead(id); loadMessages(); }
loadMessages();
</script></body></html>
