<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCC Profile</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="vcc-pro-ui.css">
<link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body>
<header class="site-header">
  <div class="nav-wrap">
    <a class="brand" href="index.html">
      <img src="assets/vcc-logo.png" alt="VCC logo">
      <span><strong>VCC</strong><small>Valorant Console Circuit</small></span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="tournaments.html">Tournaments</a>
      <a href="matches.html">Matches</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="stats.html">Stats</a>
      <a href="teams.html">Teams</a>
      <a href="players.html">Players</a>
      <a href="scrims.html">Scrims</a>
      <a href="rules.html">Rules</a>
      <a href="profile.html">Profile</a>
      <a href="inbox.html">Inbox</a>
    </nav>
  </div>
</header>

<main class="vcc-wrap">
  <section class="vcc-card">
    <div class="kicker">VCC Player Profile</div>
    <h1 id="profileTitle">My VCC Profile</h1>

    <div class="grid">
      <div>
        <img id="profilePreview" class="vcc-avatar" src="assets/vcc-logo.png" alt="Profile picture">
        <input id="profilePicInput" type="file" accept="image/*">
        <button id="uploadProfilePicBtn" type="button">Upload Profile Picture</button>
      </div>

      <div>
        <input id="displayName" placeholder="Display Name">
        <input id="riotId" placeholder="Riot ID">
        <input id="rank" placeholder="Rank">
        <input id="platform" placeholder="Platform">
        <input id="region" placeholder="Region">
        <input id="role" placeholder="Main Role">
        <input id="agents" placeholder="Main Agents">

        <select id="gender">
          <option value="">Select Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>

        <textarea id="bio" rows="5" placeholder="Profile Bio"></textarea>

        <button id="saveProfileBtn" type="button">Save Profile</button>
      </div>
    </div>

    <div id="profileStatus" class="log">Loading profile...</div>
  </section>
</main>

<script src="profile.js"></script>
<script src="auth-nav.js"></script>
</body>
</html>
