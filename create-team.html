<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VCC Create Team</title>
<link rel="stylesheet" href="styles.css">

<style>
body{background:#080808;color:#fff;font-family:Arial;margin:0}
nav{padding:18px;background:#111}
nav a{color:#fff;margin-right:14px;text-decoration:none}
.wrap{max-width:1000px;margin:35px auto;padding:20px}
.card{background:#111;border:1px solid #2d2d2d;border-radius:16px;padding:20px;margin-bottom:18px}
input,textarea,select{width:100%;box-sizing:border-box;padding:12px;background:#070707;color:#fff;border:1px solid #333;border-radius:10px;margin:7px 0}
button,.btn{background:#f5c542;color:#000;border:0;border-radius:10px;padding:12px 16px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block;margin-top:8px}
.meta{color:#aaa;font-size:13px}
.log{background:#070707;border-radius:12px;padding:12px;min-height:80px;white-space:pre-wrap}
</style>

</head>
<body>
<nav>
<a href="index.html">Home</a>
<a href="teams.html">Teams</a>
<a href="create-team.html">Create Team</a>
<a href="manage-team.html">Manage Team</a>
</nav>

<main class="wrap">
<h1>Create Team</h1>

<section id="alreadyTeamBox" class="card" style="display:none">
<h2>You already have a team</h2>
<p id="alreadyTeamText"></p>
<a class="btn" href="manage-team.html">Manage Team</a>
</section>

<section id="createTeamBox" class="card">
<p class="meta">Each account can only create one team. This prevents duplicate/fake teams.</p>
<input id="teamName" placeholder="Team Name">
<input id="teamTag" placeholder="Team Tag">
<input id="teamLogo" placeholder="Logo URL optional">
<textarea id="teamBio" rows="4" placeholder="Team bio optional"></textarea>
<button id="createTeamBtn">Create Team</button>
<div id="teamStatus" class="log">Ready.</div>
</section>
</main>

<script src="supabase-config.js"></script>
<script src="vcc-message.js"></script>
<script>
function getSB(){ return window.supabaseClient || window.supabase || window.sb || null; }

async function checkExistingTeam(){
  const status = document.getElementById("teamStatus");
  try{
    const existing = await VCCMessage.userAlreadyHasTeam();
    if(existing){
      document.getElementById("createTeamBox").style.display = "none";
      document.getElementById("alreadyTeamBox").style.display = "block";
      document.getElementById("alreadyTeamText").textContent = "You already created: " + (existing.name || existing.id);
    }
  }catch(err){
    status.textContent = "Team check error: " + err.message;
  }
}

async function createTeam(){
  const sb = getSB();
  const status = document.getElementById("teamStatus");

  try{
    const userResult = await sb.auth.getUser();
    const user = userResult.data.user;
    if(!user){ status.textContent = "You must be logged in to create a team."; return; }

    const existing = await VCCMessage.userAlreadyHasTeam();
    if(existing){
      status.textContent = "You already have a team. You cannot create more than one.";
      document.getElementById("createTeamBox").style.display = "none";
      document.getElementById("alreadyTeamBox").style.display = "block";
      document.getElementById("alreadyTeamText").textContent = "You already created: " + (existing.name || existing.id);
      return;
    }

    const teamName = document.getElementById("teamName").value.trim();
    if(!teamName){ status.textContent = "Enter a team name."; return; }

    const row = {
      name: teamName,
      tag: document.getElementById("teamTag").value.trim(),
      logo_url: document.getElementById("teamLogo").value.trim(),
      bio: document.getElementById("teamBio").value.trim(),
      captain_id: user.id,
      created_at: new Date().toISOString()
    };

    const result = await sb.from("teams").insert(row).select().single();
    if(result.error) throw result.error;

    status.textContent = "Team created. ID:\n" + result.data.id;
    setTimeout(() => location.href = "manage-team.html", 1200);
  }catch(err){
    status.textContent = "Create team failed: " + err.message;
  }
}

document.getElementById("createTeamBtn").addEventListener("click", createTeam);
checkExistingTeam();
</script>
</body>
</html>
