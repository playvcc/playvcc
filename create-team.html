</nav></div></header><main class="wrap"><div class="kicker">VCC Account</div><h1>Sign In</h1><section class="card"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Sign In</button><button id="signupBtn" class="secondary">Create Account</button><div id="status" class="log">Ready.</div></section></main><script type="module">import {supabase} from './app.js'; const s=document.getElementById('status');document.getElementById('loginBtn').onclick=async()=>{const {error}=await supabase.auth.signInWithPassword({email:email.value,password:password.value});s.textContent=error?'Error: '+error.message:'Signed in.';if(!error)setTimeout(()=>location.href='profile.html',800)};document.getElementById('signupBtn').onclick=async()=>{const {error}=await supabase.auth.signUp({email:email.value,password:password.value});s.textContent=error?'Error: '+error.message:'Account created. Check email if required.'};</script></body></html>
