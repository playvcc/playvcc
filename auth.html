<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCC Account</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="vcc-pro-ui.css">
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
.auth-page-box{width:min(520px,calc(100% - 32px));margin:70px auto;background:#111116;border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:26px}
</style>
</head>
<body>
<main class="auth-page-box">
  <div class="kicker">VCC Account</div>
  <h1 style="font-size:44px">Sign In</h1>
  <p class="lead">Sign in or create your VCC account.</p>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button id="loginBtn">Sign In</button>
  <button id="signupBtn" class="secondary">Create Account</button>
  <a class="btn secondary" href="index.html">Back Home</a>

  <div id="status" class="log">Ready.</div>
</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
import { SUPABASE_URL, SUPABASE_ANON_KEY } from './supabase-config.js';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const statusBox = document.getElementById('status');
const params = new URLSearchParams(location.search);
const mode = params.get('mode');

if(mode === 'signup'){
  document.querySelector('h1').textContent = 'Create Account';
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try{
    statusBox.textContent = 'Signing in...';
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if(error) throw error;
    statusBox.textContent = 'Signed in. Redirecting...';
    setTimeout(() => location.href = 'profile.html', 800);
  }catch(error){
    statusBox.textContent = 'Error: ' + error.message;
  }
});

document.getElementById('signupBtn').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try{
    statusBox.textContent = 'Creating account...';
    const { error } = await supabase.auth.signUp({ email, password });
    if(error) throw error;
    statusBox.textContent = 'Account created. Check email if required.';
  }catch(error){
    statusBox.textContent = 'Error: ' + error.message;
  }
});
</script>
</body>
</html>
