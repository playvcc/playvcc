<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCC Account</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="vcc-pro-ui.css">
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
body{margin:0;background:radial-gradient(circle at 50% -10%,rgba(255,41,77,.14),transparent 35%),linear-gradient(180deg,#07070a,#020203);color:#fff;font-family:Arial,Helvetica,sans-serif}.auth-page{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-box-page{width:min(560px,100%);background:#111116;border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:28px;box-shadow:0 28px 80px rgba(0,0,0,.55)}.auth-box-page input{width:100%;box-sizing:border-box;background:#050507;border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:14px;padding:15px;margin:8px 0;font-size:15px}.auth-actions{display:flex;gap:8px;flex-wrap:wrap}.small{color:#b8bdca;font-size:13px;line-height:1.45;margin-top:14px}.log{background:#050507;border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:13px;min-height:72px;white-space:pre-wrap;margin-top:14px}.kicker{color:#f5c542;text-transform:uppercase;letter-spacing:.22em;font-weight:900;font-size:13px;margin-bottom:10px}h1{font-size:46px;line-height:.95;text-transform:uppercase;letter-spacing:-.04em;margin:0 0 18px}.lead{color:#d6d9e3;font-size:18px}.btn,button{border:0;border-radius:13px;padding:13px 18px;font-weight:900;color:#fff;background:#ff294d;text-decoration:none;display:inline-flex;cursor:pointer}button.secondary,.btn.secondary{background:#202027;border:1px solid rgba(255,255,255,.15)}
</style>
</head>
<body>
<main class="auth-page">
  <section class="auth-box-page">
    <div class="kicker">VCC Account</div>
    <h1 id="authHeading">Sign In</h1>
    <p class="lead">Sign in or create your VCC account.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="password" type="password" placeholder="Password, minimum 6 characters" autocomplete="current-password">
    <div class="auth-actions">
      <button type="button" id="loginBtn">Sign In</button>
      <button type="button" id="signupBtn" class="secondary">Create Account</button>
      <a class="btn secondary" href="index.html">Back Home</a>
    </div>
    <p class="small">After signup, VCC sends you to your profile so you can add Riot ID, rank, platform, and gender.</p>
    <div id="status" class="log">Auth page loaded. Ready.</div>
  </section>
</main>
<script>
(function(){
  const statusBox=document.getElementById('status'); const emailInput=document.getElementById('email'); const passwordInput=document.getElementById('password');
  const params=new URLSearchParams(location.search); if(params.get('mode')==='signup') document.getElementById('authHeading').textContent='Create Account';
  function setStatus(m){statusBox.textContent=m}
  function validate(){const email=emailInput.value.trim(); const password=passwordInput.value; if(!email){setStatus('Enter your email.');return null} if(!password||password.length<6){setStatus('Password must be at least 6 characters.');return null} return {email,password}}
  async function getSupabase(){setStatus('Loading Supabase connection...'); const config=await import('./supabase-config.js'); if(!config.SUPABASE_URL||config.SUPABASE_URL.includes('PASTE_')) throw new Error('SUPABASE_URL is missing in supabase-config.js'); if(!config.SUPABASE_ANON_KEY||config.SUPABASE_ANON_KEY.includes('PASTE_')) throw new Error('SUPABASE_ANON_KEY is missing in supabase-config.js'); const lib=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'); return lib.createClient(config.SUPABASE_URL,config.SUPABASE_ANON_KEY)}
  async function signIn(){const f=validate(); if(!f)return; try{setStatus('Signing in...'); const supabase=await getSupabase(); const result=await supabase.auth.signInWithPassword(f); if(result.error)throw result.error; if(!result.data?.session){setStatus('Sign in finished but no session returned. Confirm your email first if required.');return} setStatus('Signed in successfully. Redirecting to profile...'); setTimeout(()=>location.href='profile.html',900)}catch(e){setStatus('Sign in error: '+e.message)}}
  async function createAccount(){const f=validate(); if(!f)return; try{setStatus('Creating account...'); const supabase=await getSupabase(); const result=await supabase.auth.signUp(f); if(result.error)throw result.error; setStatus(result.data?.session?'Account created and signed in. Redirecting to profile...':'Account created. Check email if required. Redirecting to profile/sign in...'); setTimeout(()=>location.href='profile.html',1200)}catch(e){setStatus('Create account error: '+e.message)}}
  document.getElementById('loginBtn').addEventListener('click',signIn); document.getElementById('signupBtn').addEventListener('click',createAccount); document.addEventListener('keydown',e=>{if(e.key==='Enter')signIn()}); setStatus('Auth page loaded. Buttons connected. Ready.');
})();
</script>
</body>
</html>
