<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCC Account</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="vcc-pro-ui.css">
<link rel="icon" type="image/png" href="assets/favicon.png">

<style>
.auth-page{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
  background:
    radial-gradient(circle at 50% -10%,rgba(255,41,77,.14),transparent 35%),
    linear-gradient(180deg,#07070a,#020203);
}

.auth-box-page{
  width:min(520px,100%);
  background:#111116;
  border:1px solid rgba(255,255,255,.14);
  border-radius:24px;
  padding:28px;
  box-shadow:0 28px 80px rgba(0,0,0,.55);
}

.auth-logo{
  width:88px;
  height:88px;
  border-radius:18px;
  object-fit:cover;
  display:block;
  margin-bottom:18px;
  border:1px solid rgba(255,255,255,.16);
}

.auth-tabs{
  display:flex;
  gap:10px;
  margin:18px 0;
}

.auth-tabs button{
  flex:1;
}

.auth-tabs button.active{
  background:#f5c542;
  color:#050507;
}

.auth-box-page input{
  width:100%;
  background:#050507;
  border:1px solid rgba(255,255,255,.16);
  color:#fff;
  border-radius:14px;
  padding:14px 15px;
  margin:7px 0;
}

.auth-box-page .small{
  color:#b8bdca;
  font-size:13px;
  line-height:1.45;
}

.auth-box-page .log{
  margin-top:14px;
}
</style>
</head>

<body>
<main class="auth-page">
  <section class="auth-box-page">
    <img class="auth-logo" src="assets/vcc-logo.png" alt="VCC logo">

    <div class="kicker">VCC Account</div>
    <h1 id="authHeading" style="font-size:44px;margin-bottom:10px">Sign In</h1>
    <p class="lead" style="font-size:16px;margin-bottom:12px">
      Sign in or create your VCC account to manage your profile, teams, inbox, and matches.
    </p>

    <div class="auth-tabs">
      <button type="button" id="tabLogin" class="active">Sign In</button>
      <button type="button" id="tabSignup" class="secondary">Create Account</button>
    </div>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password, minimum 6 characters">

    <button type="button" id="submitBtn">Sign In</button>
    <a class="btn secondary" href="index.html">Back Home</a>

    <p class="small">
      If account creation says to check email, confirm your email first, then come back and sign in.
    </p>

    <div id="status" class="log">Ready.</div>
  </section>
</main>

<script type="module" src="auth.js"></script>
</body>
</html>
