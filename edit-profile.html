<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VCC | Edit Profile</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="profile-data.js"></script>
</head>
<body>
  <header class="vcc-header">
    <div class="brand">
      <img src="assets/vcc-logo.png" onerror="this.src='VCC.png'" alt="VCC Logo" class="brand-logo" />
      <div>
        <h1>VCC</h1>
        <p>Valorant Console Circuit</p>
      </div>
    </div>

    <nav class="top-nav">
      <a href="index.html">Home</a>
      <a href="tournaments.html">Tournaments</a>
      <a href="matches.html">Matches</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="stats.html">Stats</a>
      <a href="teams.html">Teams</a>
      <a href="players.html">Players</a>
      <a href="scrims.html">Scrims</a>
      <a href="rules.html">Rules</a>
      <a href="profile.html">Profile</a>
      <a href="inbox.html">Inbox</a>
      <button id="signOutBtn" class="sign-out">Sign Out</button>
    </nav>
  </header>

  <main class="profile-page">
    <section class="panel edit-panel">
      <div class="panel-title">
        <h3>EDIT PLAYER PROFILE</h3>
        <a href="profile.html">Back to Profile</a>
      </div>

      <div class="edit-profile-layout">
        <div class="upload-column">
          <img id="editAvatarPreview" class="profile-avatar" src="assets/default-avatar.png" onerror="this.src='VCC.png'" alt="Profile Picture Preview" />
          <input id="profilePicInput" type="file" accept="image/*" />
          <button id="uploadProfilePicBtn" class="primary-btn" type="button">Upload Profile Picture</button>
          <p id="uploadStatus" class="status-text">Profile loaded.</p>
        </div>

        <form id="profileForm" class="profile-form">
          <input id="profileName" type="text" placeholder="Display Name" />
          <input id="riotId" type="text" placeholder="Riot ID" />
          <input id="rank" type="text" placeholder="Rank" />
          <input id="platform" type="text" placeholder="Platform" />
          <input id="region" type="text" placeholder="Region" />
          <input id="mainRole" type="text" placeholder="Main Role" />
          <input id="mainAgents" type="text" placeholder="Main Agents" />

          <select id="gender">
            <option value="">Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Prefer not to say</option>
          </select>

          <textarea id="profileBio" placeholder="Profile Bio"></textarea>

          <button class="primary-btn" type="submit">Save Profile</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
