<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit VCC Profile</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#030303;color:white;font-family:Arial,Helvetica,sans-serif;font-weight:700} a{color:inherit;text-decoration:none}.nav{max-width:1120px;margin:10px auto 18px;padding:12px 14px;border:1px solid #161616;border-radius:16px;background:rgba(0,0,0,.72);display:flex;align-items:center;gap:22px}.brand{display:flex;align-items:center;gap:12px;margin-right:auto}.brand img{width:62px;height:62px;border-radius:12px;object-fit:cover}.brand h1{margin:0;font-size:34px}.brand p{margin:0;color:#b9bdc7;font-size:12px}.nav a,.signout{font-size:15px}.signout{background:#252530;border:1px solid #333442;border-radius:12px;padding:14px 18px}.wrap{max-width:1240px;margin:0 auto 40px;padding:35px 20px;border:1px solid #101010;border-radius:18px}.title{font-size:52px;margin:0 0 30px}.grid{display:grid;grid-template-columns:420px 1fr;gap:32px}.pic{width:150px;height:150px;border:3px solid #806a13;border-radius:14px;object-fit:cover;background:#fff}.uploadBox{border:1px solid #151515;border-radius:14px;padding:14px;margin-top:14px}.btn{border:0;border-radius:13px;background:#ff2f5f;color:white;padding:15px 20px;font-weight:800;cursor:pointer}.form{display:grid;gap:14px}input,select,textarea{width:100%;background:#050505;border:1px solid #171717;border-radius:14px;color:white;padding:16px;font-weight:700}textarea{min-height:105px;resize:vertical}.status{margin-top:12px;border:1px solid #191919;border-radius:12px;padding:18px;font-weight:500}@media(max-width:850px){.grid{grid-template-columns:1fr}.nav{flex-wrap:wrap}.brand{width:100%}}
  </style>
</head>
<body>
  <nav class="nav"><div class="brand"><img src="assets/vcc-logo.png" onerror="this.src='https://placehold.co/80x80/fff/ff304f?text=VCC'" alt="VCC"><div><h1>VCC</h1><p>Valorant Console Circuit</p></div></div><a href="index.html">Home</a><a href="tournaments.html">Tournaments</a><a href="matches.html">Matches</a><a href="leaderboard.html">Leaderboard</a><a href="stats.html">Stats</a><a href="teams.html">Teams</a><a href="players.html">Players</a><a href="scrims.html">Scrims</a><a href="rules.html">Rules</a><a href="profile.html">Profile</a><a href="inbox.html">Inbox</a><a class="signout" href="index.html">Sign Out</a></nav>
  <main class="wrap"><h1 class="title">EDIT PROFILE</h1><section class="grid"><div><img id="preview" class="pic" src="assets/vcc-logo.png" onerror="this.src='https://placehold.co/160x160/fff/ff304f?text=VCC'" alt="Profile preview"><div class="uploadBox"><input id="picInput" type="file" accept="image/*"></div><button class="btn" type="button" id="uploadBtn">Upload Profile Picture</button></div><form class="form" id="profileForm"><input id="displayName" placeholder="Display Name"><input id="riotId" placeholder="Riot ID"><input id="rank" placeholder="Rank"><input id="platform" placeholder="Platform"><input id="region" placeholder="Region"><input id="role" placeholder="Main Role"><input id="agents" placeholder="Main Agents"><select id="gender"><option value="">Gender</option><option>Male</option><option>Female</option><option>Other</option><option>Prefer not to say</option></select><textarea id="bio" placeholder="Profile Bio"></textarea><button class="btn" type="submit">Save Profile</button></form></section><div id="status" class="status">Profile loaded.</div></main>
  <script>
    const fields=['displayName','riotId','rank','platform','region','role','agents','gender','bio']; let data=JSON.parse(localStorage.getItem('vccProfile')||'{}'); fields.forEach(id=>{document.getElementById(id).value=data[id]||''}); if(data.profilePic) preview.src=data.profilePic;
    picInput.addEventListener('change',()=>{const file=picInput.files[0]; if(!file)return; const r=new FileReader(); r.onload=e=>{data.profilePic=e.target.result; preview.src=data.profilePic; status.textContent='Picture ready. Press Save Profile.'}; r.readAsDataURL(file)});
    uploadBtn.addEventListener('click',()=>picInput.click());
    profileForm.addEventListener('submit',e=>{e.preventDefault(); fields.forEach(id=>data[id]=document.getElementById(id).value.trim()); localStorage.setItem('vccProfile',JSON.stringify(data)); status.textContent='Profile saved. Returning to public profile...'; setTimeout(()=>location.href='profile.html',500)});
  </script>
</body>
</html>
