<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Invites — VCC</title><link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/png" href="assets/favicon.png"></head><body>

<header class="site-header">
  <div class="nav-wrap professional-nav">
    <a class="brand" href="index.html">
      <img src="assets/vcc-logo.png" alt="VCC logo">
      <span>
        <strong>VCC</strong>
        <small>Valorant Console Circuit</small>
      </span>
    </a>

    <button class="mobile-menu-btn" onclick="document.body.classList.toggle('nav-open')">☰</button>

    <nav class="main-nav">

</header>


<main class="page"><h1>Team Invites</h1><div class="notice"><strong>One-Team Lock:</strong> You cannot accept an invite if already on an active roster.</div><div id="status" class="status">Loading...</div><div id="invitesBox" class="cards"></div></main>
<script type="module">
import {requireUser,supabase,setStatus,subscribeToTable} from './app.js'
const user=await requireUser()
async function load(){const {data,error}=await supabase.from('team_invites').select('id,status,role_offered,message,teams(name,division)').eq('player_id',user.id).eq('status','pending');if(error)return setStatus(error.message);setStatus((data||[]).length+' pending invite(s).');invitesBox.innerHTML=(data||[]).map(i=>`<div class="card"><h3>${i.teams?.name}</h3><p>${i.teams?.division}</p><p>Role: <span class="tag">${i.role_offered||'Player'}</span></p><p>${i.message||''}</p><button class="btn primary" data-accept="${i.id}">Accept</button><button class="btn danger" data-decline="${i.id}">Decline</button></div>`).join('')||'<div class="card"><p>No invites.</p></div>';document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=async()=>{const {error}=await supabase.rpc('accept_team_invite',{invite_id_input:b.dataset.accept});setStatus(error?error.message:'Invite accepted.');load()});document.querySelectorAll('[data-decline]').forEach(b=>b.onclick=async()=>{const {error}=await supabase.from('team_invites').update({status:'declined'}).eq('id',b.dataset.decline);setStatus(error?error.message:'Invite declined.');load()})}
load();subscribeToTable('team_invites',load)
</script></body></html>
