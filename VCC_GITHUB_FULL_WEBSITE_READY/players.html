<main class="page"><h1>Players</h1><div class="notice">Emails are private. Only public profile details appear here.</div><div id="playersBox" class="cards"></div></main>
<script type="module">
import {getPlayers,subscribeToTable} from './app.js'
async function render(){try{const data=await getPlayers();playersBox.innerHTML=data.length?data.map(p=>{const active=(p.team_memberships||[]).find(m=>m.status==='active');return `<div class="card">${p.avatar_url ? `<img class="player-avatar" src="${p.avatar_url}" alt="${p.username} profile picture">` : `<div class="avatar-placeholder">${(p.username||'P')[0].toUpperCase()}</div>`}<h3>${p.username}</h3><p>${p.riot_id||'Riot ID not set'}</p><span class="tag">${p.role||'Role not set'}</span><span class="tag">${p.platform||'Platform not set'}</span><span class="tag">${active?active.teams?.name:'Free Agent'}</span><p>${p.bio||''}</p></div>`}).join(''):'<div class="card"><p>No registered players yet.</p></div>'}catch(e){playersBox.innerHTML='<div class="card"><p>'+e.message+'</p></div>'}}
render();subscribeToTable('profiles',render);subscribeToTable('team_memberships',render)
</script></body></html>
