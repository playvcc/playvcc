<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login — VCC</title><link rel="stylesheet" href="styles.css"></head><body>

<header class="site-header">
  <div class="nav-wrap professional-nav">
    <a class="brand" href="index.html">
      <img src="assets/vcc-logo.png" alt="VCC logo">
      <span>
        <strong>VCC</strong>
        <small>Valorant Console Circuit</small>
      </span>
    </a>

    <button class="mobile-menu-btn" onclick="document.body.classList.toggle('nav-open')">☰</button>

    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="teams.html">Teams</a>
      <a href="players.html">Players</a>
      <a href="scrims.html">Scrims</a>
      <a href="rules.html">Rules</a>
      <a href="profile.html">Profile</a>
      <a href="create-team.html">Create Team</a>
      <a href="manage-team.html">Manage Team</a>
      <a href="inbox.html">Invites</a>
      <a class="discord-nav" href="https://discord.gg/RsMdZ2nHnx" target="_blank">SiN Discord</a>
    </nav>
  </div>
</header>


<main class="page"><h1>Login / Sign Up</h1>
<div class="notice"><strong>Privacy:</strong> email is only used for login. Public pages only show username and public profile information.</div>
<div class="form">
<div id="status" class="status">Create an account or log in.</div>

<h2>Sign Up</h2>
<div class="grid two">
<label>Email <span class="small">(private)</span><input id="signupEmail" type="email" autocomplete="email"></label>
<label>Username <span class="small">(public)</span><input id="signupUsername" autocomplete="username"></label>
</div>
<label>Password<input id="signupPassword" type="password" autocomplete="new-password"></label>
<button class="btn primary" id="signup" type="button">Sign Up</button>

<h2>Login</h2>
<div class="grid two">
<label>Email<input id="loginEmail" type="email" autocomplete="email"></label>
<label>Password<input id="loginPassword" type="password" autocomplete="current-password"></label>
</div>
<button class="btn ghost" id="login" type="button">Login</button>
<button class="btn danger" id="logout" type="button">Logout</button>
</div></main>

<script type="module">
import { supabase, setStatus } from './app.js'
import { SUPABASE_URL, SUPABASE_ANON_KEY } from './supabase-config.js'

function configMissing() {
  return !SUPABASE_URL || !SUPABASE_ANON_KEY || SUPABASE_URL.includes('PASTE_') || SUPABASE_ANON_KEY.includes('PASTE_')
}

if (location.protocol === 'file:') setStatus('Upload to Netlify before testing signup. Local file preview can block backend scripts.')
else if (configMissing()) setStatus('Supabase config missing.')
else setStatus('Backend connected. Sign up or log in.')

signup.onclick = async () => {
  try {
    if (configMissing()) return setStatus('Supabase config missing.')
    const email = signupEmail.value.trim().toLowerCase()
    const password = signupPassword.value
    const username = signupUsername.value.trim()

    if (!email || !password || !username) return setStatus('Email, username, and password required.')
    if (password.length < 6) return setStatus('Password must be at least 6 characters.')

    setStatus('Creating account...')

    const { error } = await supabase.auth.signUp({
      email,
      password,
      options: { data: { username } }
    })

    if (error) return setStatus(error.message)

    setStatus('Account created. Now log in with the same email and password.')
  } catch (e) {
    setStatus(e.message || String(e))
  }
}

login.onclick = async () => {
  try {
    const email = loginEmail.value.trim().toLowerCase()
    const password = loginPassword.value

    if (!email || !password) return setStatus('Email and password required.')

    setStatus('Logging in...')

    const { error } = await supabase.auth.signInWithPassword({ email, password })
    if (error) return setStatus(error.message)

    location.href = 'profile.html'
  } catch (e) {
    setStatus(e.message || String(e))
  }
}

logout.onclick = async () => {
  await supabase.auth.signOut()
  setStatus('Logged out.')
}
</script></body></html>
