<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VCC Message Player</title>
<link rel="stylesheet" href="styles.css">

<style>
body{background:#080808;color:#fff;font-family:Arial;margin:0}
nav{padding:18px;background:#111}
nav a{color:#fff;margin-right:14px;text-decoration:none}
.wrap{max-width:1000px;margin:35px auto;padding:20px}
.card{background:#111;border:1px solid #2d2d2d;border-radius:16px;padding:20px;margin-bottom:18px}
input,textarea,select{width:100%;box-sizing:border-box;padding:12px;background:#070707;color:#fff;border:1px solid #333;border-radius:10px;margin:7px 0}
button,.btn{background:#f5c542;color:#000;border:0;border-radius:10px;padding:12px 16px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block;margin-top:8px}
.meta{color:#aaa;font-size:13px}
.log{background:#070707;border-radius:12px;padding:12px;min-height:80px;white-space:pre-wrap}
</style>

</head>
<body>
<nav>
<a href="index.html">Home</a>
<a href="players.html">Players</a>
<a href="profile.html">Profile</a>
<a href="inbox.html">Inbox</a>
</nav>

<main class="wrap">
<h1>Message Player</h1>
<section class="card">
<p class="meta">Send a private VCC message to a player inbox.</p>
<input id="recipientEmail" placeholder="Recipient email">
<input id="recipientUserId" placeholder="Recipient user ID optional">
<input id="messageTitle" placeholder="Message title" value="VCC Message">
<textarea id="messageBody" rows="6" placeholder="Type your message"></textarea>
<button id="sendMessageBtn">Send Message</button>
<div id="messageStatus" class="log">Ready.</div>
</section>
</main>

<script src="supabase-config.js"></script>
<script src="vcc-message.js"></script>
<script>
const params = new URLSearchParams(location.search);
if(params.get("email")) document.getElementById("recipientEmail").value = params.get("email");
if(params.get("user")) document.getElementById("recipientUserId").value = params.get("user");

document.getElementById("sendMessageBtn").addEventListener("click", async function(){
  const status = document.getElementById("messageStatus");
  try{
    const body = document.getElementById("messageBody").value.trim();
    if(!body){ status.textContent = "Type a message first."; return; }

    const sent = await VCCMessage.sendDirectMessage({
      recipientEmail: document.getElementById("recipientEmail").value.trim() || null,
      recipientUserId: document.getElementById("recipientUserId").value.trim() || null,
      title: document.getElementById("messageTitle").value.trim() || "VCC Message",
      body
    });

    status.textContent = "Message sent. ID:\n" + sent.id;
  }catch(err){
    status.textContent = "Error: " + err.message;
  }
});
</script>
</body>
</html>
