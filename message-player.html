<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message Player — VCC</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="vcc-pro-ui.css">
<link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body>
<header class="site-header">
  <div class="nav-wrap">
    <a class="brand" href="index.html">
      <img src="assets/vcc-logo.png" alt="VCC logo">
      <span><strong>VCC</strong><small>Valorant Console Circuit</small></span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="tournaments.html">Tournaments</a>
      <a href="matches.html">Matches</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="stats.html">Stats</a>
      <a href="teams.html">Teams</a>
      <a href="players.html">Players</a>
      <a href="scrims.html">Scrims</a>
      <a href="rules.html">Rules</a>
      <a href="profile.html">Profile</a>
      <a href="inbox.html">Inbox</a>
      <a href="admin.html">Admin</a>
    </nav>
  </div>
</header>
<main class="vcc-wrap">
  <div class="kicker">VCC Messaging</div>
  <h1>Message Player</h1>
  <p class="lead">Send a direct message to another player by profile ID or email.</p>

  <section class="vcc-card">
    <input id="recipientUserId" placeholder="Recipient profile/user ID optional">
    <input id="recipientEmail" placeholder="Recipient email optional">
    <input id="messageTitle" value="VCC Message" placeholder="Title">
    <textarea id="messageBody" rows="5" placeholder="Message"></textarea>
    <button id="sendMessageBtn">Send Message</button>
    <div id="messageStatus" class="log">Ready.</div>
  </section>
</main>
<script src="message-player.js"></script>
</body>
</html>
