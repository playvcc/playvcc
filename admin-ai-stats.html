</nav></div></header><main class="wrap"><div class="kicker">Secure Admin</div><h1>Admin Panel</h1><p class="lead">Create tournaments, groups, and matches. You must be listed in the admins table.</p><section class="card"><h2>Create Tournament</h2><input id="tName" value="VCC Pre-Season Premier"><textarea id="tDesc" placeholder="Description"></textarea><select id="tCategory"><option>Preseason League</option><option>Pro Point Qualifier</option><option>Major</option><option>Championship Finals</option><option>Group Stage</option><option>Group Stage + Playoffs</option></select><select id="tFormat"><option>Premier Style League</option><option>Single Elimination</option><option>Double Elimination</option><option>Group Stage</option><option>Group Stage + Playoffs</option><option>Round Robin</option></select><input id="tStart" type="datetime-local"><input id="tRosterLock" type="datetime-local"><div class="grid-3"><input id="groupCount" type="number" value="4" placeholder="Groups"><input id="teamsPerGroup" type="number" value="4"><input id="advancePerGroup" type="number" value="2"></div><button id="createTournamentBtn" class="gold">Create Tournament</button><div id="createStatus" class="log">Ready.</div></section><section class="card"><h2>Group Stage Tools</h2><input id="groupTournamentId" placeholder="Tournament ID"><textarea id="teamIds" placeholder="Team IDs separated by commas"></textarea><button id="createGroupsBtn">Create Groups</button><button id="assignTeamsBtn" class="secondary">Assign Teams</button><button id="generateMatchesBtn" class="secondary">Generate Group Matches</button><div id="groupStatus" class="log">Ready.</div></section></main><script type="module" src="admin-panel.js"></script></body></html>
