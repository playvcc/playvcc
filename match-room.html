<!DOCTYPE html><html><head><meta charset="UTF-8"><title>VCC Match Room</title><link rel="stylesheet" href="styles.css"><style>
body{background:#080808;color:#fff;font-family:Arial;margin:0}
nav{padding:18px;background:#111}
nav a{color:#fff;margin-right:14px;text-decoration:none}
.wrap{max-width:1100px;margin:35px auto;padding:20px}
.card{background:#111;border:1px solid #2d2d2d;border-radius:16px;padding:20px;margin-bottom:18px}
input,select,textarea{width:100%;box-sizing:border-box;padding:12px;background:#070707;color:#fff;border:1px solid #333;border-radius:10px;margin:7px 0}
button,.btn{background:#f5c542;color:#000;border:0;border-radius:10px;padding:12px 16px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}
.log{background:#070707;border-radius:12px;padding:12px;min-height:120px;max-height:330px;overflow:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.meta{color:#aaa;font-size:13px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body>
<nav><a href="index.html">Home</a><a href="matches.html">Matches</a><a href="tournaments.html">Tournaments</a></nav>
<main class="wrap"><h1>VCC Match Room</h1><p>Match ID: <span id="matchIdText"></span></p>
<section class="grid"><div class="card"><h2>Submit Score</h2><input id="teamName" placeholder="Your team name"><input id="teamId" placeholder="Your team ID optional"><input id="scoreA" type="number" placeholder="Team A maps won"><input id="scoreB" type="number" placeholder="Team B maps won"><input id="proofUrl" placeholder="Screenshot/proof URL optional"><button id="submitScoreBtn">Submit Score</button><p id="scoreStatus" class="meta"></p></div>
<div class="card"><h2>Match Chat</h2><div id="chatLog" class="log"></div><input id="chatName" placeholder="Display name"><textarea id="chatMessage" rows="3" placeholder="Message captains/admins"></textarea><button id="sendChatBtn">Send Chat</button></div></section>
</main>
<script src="supabase-config.js"></script><script src="vcc-live.js"></script>
<script>
const params=new URLSearchParams(location.search);const matchId=params.get("match")||params.get("id");document.getElementById("matchIdText").textContent=matchId||"Missing match ID";
function renderChat(messages){const box=document.getElementById("chatLog");box.innerHTML=messages.length?messages.map(m=>`<div><strong>${m.username||"Player"}:</strong> ${m.message}<div class="meta">${new Date(m.created_at).toLocaleString()}</div></div>`).join(""):"<p class='meta'>No chat messages yet.</p>";box.scrollTop=box.scrollHeight;}
async function loadChat(){if(!matchId)return;renderChat(await VCC.loadMatchChat(matchId));}
document.getElementById("sendChatBtn").onclick=async()=>{const username=document.getElementById("chatName").value.trim()||"Player";const message=document.getElementById("chatMessage").value.trim();if(!matchId||!message)return;await VCC.sendMatchChat(matchId,username,message);document.getElementById("chatMessage").value="";loadChat();};
document.getElementById("submitScoreBtn").onclick=async()=>{const status=document.getElementById("scoreStatus");try{const result=await VCC.submitMatchScore({matchId,teamId:document.getElementById("teamId").value.trim()||null,teamName:document.getElementById("teamName").value.trim(),scoreA:document.getElementById("scoreA").value,scoreB:document.getElementById("scoreB").value,proofUrl:document.getElementById("proofUrl").value.trim()});status.textContent=result.status==="approved"?"Scores matched. Result approved and site updated.":result.status==="disputed"?"Scores did not match. Match is now disputed.":"Score submitted. Waiting for other team.";}catch(e){status.textContent="Error: "+e.message;}};
loadChat();if(matchId) VCC.subscribeMatchChat(matchId,loadChat);
</script></body></html>
